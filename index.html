<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModuLearn </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-card">
        <div id="status-alert">
        </div>

        <!-- LOGIN FORM -->
        <div id="login-container">
            <div class="logo-section">
                <img src="modulearn_logo.png" alt="ModuLearn Logo">
            </div>
            <h2>ModuLearn</h2>
            <span class="tagline">Empowering Learning Through Innovation</span>

            <form id="login-form">
                <label for="login-form">Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email" required>
                
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>

                <div class="flex-row">
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>
                <p class="footer-text">Don't have an account? <a href="#" id="to-register">Sign up</a></p>      
        </div>

        <!-- REGISTER FORM  -->
        <div id="register-container" style="display: none;">
            <div class="logo-section">
                <img src="modulearn_logo.png" alt="ModuLearn Logo">
            </div>
            <h2>Create Account</h2>
            <span class="tagline">Join the ModuLearn Community</span>
            
            <form id="register-form">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter your full name" required>

                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" placeholder="Enter your email" required>
                
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Create a password" required>

                <!-- Role  -->
                <label for="reg-role">I am a:</label>
                <select id="reg-role" class="role-dropdown" required>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>
                
                <button type="submit" class="btn-primary" style="margin-top: 20px;">Create Account</button>
            </form>
                <p class="footer-text">Already have an account? <a href="#" id="to-login">Login</a></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
